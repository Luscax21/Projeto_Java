<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Veículos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 40px 16px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .btn-voltar {
            background: #e2e8f0; border: none; border-radius: 8px;
            padding: 8px 14px; cursor: pointer; font-size: 14px;
            color: #2d3748; text-decoration: none; font-weight: 600;
        }
        .btn-voltar:hover { background: #cbd5e0; }
        h1 { font-size: 22px; color: #1a202c; }
        .filtros { background: #f7fafc; border-radius: 12px; padding: 24px; margin-bottom: 32px; }
        .filtros h2 { font-size: 13px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
        .grid-filtros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
        .grid-filtros-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 14px; color: #2d3748;
            outline: none; background: white; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #2b6cb0; }
        .acoes { display: flex; gap: 12px; }
        .btn-buscar {
            padding: 10px 24px; background: #2b6cb0; color: white;
            border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-buscar:hover { background: #2c5282; }
        .btn-limpar {
            padding: 10px 20px; background: #e2e8f0; color: #2d3748;
            border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-limpar:hover { background: #cbd5e0; }
        .resultado-info { font-size: 14px; color: #718096; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th {
            text-align: left; padding: 10px 14px; background: #f7fafc;
            color: #4a5568; font-weight: 700; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.04em;
            border-bottom: 2px solid #e2e8f0;
        }
        td { padding: 12px 14px; border-bottom: 1px solid #f0f4f8; color: #2d3748; }
        tbody tr { cursor: pointer; transition: background 0.15s; }
        tbody tr:hover td { background: #ebf4ff; }
        .dica { font-size: 12px; color: #a0aec0; margin-bottom: 12px; }
        .badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 12px; font-weight: 600;
        }
        .badge-disponivel { background: #c6f6d5; color: #276749; }
        .badge-vendido { background: #fed7d7; color: #9b2c2c; }
        .badge-reservado { background: #fefcbf; color: #744210; }
        .vazio { text-align: center; padding: 48px; color: #a0aec0; font-size: 15px; }

        /* Modal */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 100;
            justify-content: center; align-items: center;
        }
        .overlay.aberto { display: flex; }
        .modal {
            background: white; border-radius: 16px;
            padding: 36px; width: 100%; max-width: 440px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            position: relative;
        }
        .modal-fechar {
            position: absolute; top: 16px; right: 18px;
            background: none; border: none; font-size: 22px;
            cursor: pointer; color: #718096; line-height: 1;
        }
        .modal-fechar:hover { color: #1a202c; }
        .modal h2 { font-size: 18px; color: #1a202c; margin-bottom: 6px; }
        .modal-info { font-size: 13px; color: #718096; margin-bottom: 24px; }
        .modal-secao { font-size: 12px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
        .status-opcoes { display: flex; gap: 10px; margin-bottom: 28px; }
        .btn-status {
            flex: 1; padding: 10px 6px; border-radius: 8px;
            border: 2px solid #e2e8f0; background: white;
            font-size: 13px; font-weight: 600; cursor: pointer;
            color: #4a5568; transition: all 0.15s;
        }
        .btn-status:hover { border-color: #2b6cb0; color: #2b6cb0; }
        .btn-status.ativo-disponivel { background: #c6f6d5; border-color: #38a169; color: #276749; }
        .btn-status.ativo-vendido { background: #fed7d7; border-color: #e53e3e; color: #9b2c2c; }
        .btn-status.ativo-reservado { background: #fefcbf; border-color: #d69e2e; color: #744210; }
        .preco-row {
            display: flex; gap: 10px; align-items: center; margin-bottom: 28px;
        }
        .preco-row input {
            flex: 1; padding: 10px 12px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 15px; color: #2d3748; outline: none;
        }
        .preco-row input:focus { border-color: #2b6cb0; }
        .btn-salvar-preco {
            padding: 10px 18px; background: #2b6cb0; color: white;
            border: none; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-salvar-preco:hover { background: #2c5282; }
        .btn-apagar {
            width: 100%; padding: 12px; background: #fff5f5;
            color: #c53030; border: 1.5px solid #feb2b2;
            border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-apagar:hover { background: #fed7d7; }
        .modal-msg { margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
        .modal-msg.sucesso { background: #c6f6d5; color: #276749; display: block; }
        .modal-msg.erro { background: #fed7d7; color: #9b2c2c; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">
            <a href="index.html" class="btn-voltar">&#8592; Voltar</a>
            <h1>Consultar Veículos</h1>
        </div>

        <div class="filtros">
            <h2>Filtros</h2>
            <div class="grid-filtros">
                <div><label for="fMarca">Marca</label><input type="text" id="fMarca" placeholder="Ex: Toyota"></div>
                <div><label for="fModelo">Modelo</label><input type="text" id="fModelo" placeholder="Ex: Corolla"></div>
                <div><label for="fCor">Cor</label><input type="text" id="fCor" placeholder="Ex: Prata"></div>
            </div>
            <div class="grid-filtros-2">
                <div><label for="fAno">Ano de Fabricação</label><input type="number" id="fAno" placeholder="Ex: 2023"></div>
                <div>
                    <label for="fStatus">Status</label>
                    <select id="fStatus">
                        <option value="">Todos</option>
                        <option value="Disponível">Disponível</option>
                        <option value="Vendido">Vendido</option>
                        <option value="Reservado">Reservado</option>
                    </select>
                </div>
            </div>
            <div class="acoes">
                <button class="btn-buscar" onclick="buscar()">&#128269; Buscar</button>
                <button class="btn-limpar" onclick="limpar()">Limpar Filtros</button>
            </div>
        </div>

        <div id="resultadoInfo" class="resultado-info"></div>
        <p id="dica" class="dica" style="display:none;">Clique em um veículo para editar o status ou excluir.</p>
        <div id="resultados"></div>
    </div>

    <!-- Modal -->
    <div class="overlay" id="overlay" onclick="fecharSeForaModal(event)">
        <div class="modal" id="modal">
            <button class="modal-fechar" onclick="fecharModal()">&#x2715;</button>
            <h2 id="modalTitulo"></h2>
            <p class="modal-info" id="modalInfo"></p>

            <p class="modal-secao">Alterar Preço</p>
            <div class="preco-row">
                <input type="number" id="inputPreco" min="0" step="0.01" placeholder="Novo preço (R$)">
                <button class="btn-salvar-preco" onclick="salvarPreco()">Salvar</button>
            </div>

            <p class="modal-secao">Alterar Status</p>
            <div class="status-opcoes">
                <button class="btn-status" id="btnDisponivel" onclick="alterarStatus('Disponível')">Disponível</button>
                <button class="btn-status" id="btnVendido" onclick="alterarStatus('Vendido')">Vendido</button>
                <button class="btn-status" id="btnReservado" onclick="alterarStatus('Reservado')">Reservado</button>
            </div>

            <button class="btn-apagar" onclick="apagarVeiculo()">&#128465; Apagar Veículo</button>
            <div id="modalMsg" class="modal-msg"></div>
        </div>
    </div>

    <script>
        let veiculoSelecionado = null;

        function badgeStatus(status) {
            const cls = status === 'Disponível' ? 'badge-disponivel' : status === 'Vendido' ? 'badge-vendido' : 'badge-reservado';
            return '<span class="badge ' + cls + '">' + status + '</span>';
        }

        function formatarPreco(v) {
            return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function buscar() {
            const params = new URLSearchParams();
            const marca = document.getElementById('fMarca').value.trim();
            const modelo = document.getElementById('fModelo').value.trim();
            const cor = document.getElementById('fCor').value.trim();
            const ano = document.getElementById('fAno').value.trim();
            const status = document.getElementById('fStatus').value;
            if (marca) params.append('marca', marca);
            if (modelo) params.append('modelo', modelo);
            if (cor) params.append('cor', cor);
            if (ano) params.append('anoFabricacao', ano);
            if (status) params.append('status', status);
            try {
                const url = '/veiculos/buscar' + (params.toString() ? '?' + params.toString() : '');
                const res = await fetch(url);
                const lista = await res.json();
                renderizar(lista);
            } catch (e) {
                document.getElementById('resultados').innerHTML = '<p class="vazio">Erro ao buscar veículos.</p>';
            }
        }

        function renderizar(lista) {
            const info = document.getElementById('resultadoInfo');
            const div = document.getElementById('resultados');
            const dica = document.getElementById('dica');
            info.textContent = lista.length + ' veículo(s) encontrado(s)';

            if (lista.length === 0) {
                div.innerHTML = '<p class="vazio">Nenhum veículo encontrado.</p>';
                dica.style.display = 'none';
                return;
            }

            dica.style.display = 'block';
            let html = '<table><thead><tr><th>ID</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cor</th><th>Preço</th><th>Quilometragem</th><th>Status</th></tr></thead><tbody>';
            lista.forEach(v => {
                const dados = encodeURIComponent(JSON.stringify(v));
                html += '<tr onclick="abrirModal(\'' + dados + '\')">'
                    + '<td>' + v.id + '</td>'
                    + '<td>' + (v.marca ? v.marca.nome : '-') + '</td>'
                    + '<td>' + v.modelo + '</td>'
                    + '<td>' + v.anoFabricacao + '</td>'
                    + '<td>' + v.cor + '</td>'
                    + '<td>' + formatarPreco(v.preco) + '</td>'
                    + '<td>' + v.quilometragem.toLocaleString('pt-BR') + ' km</td>'
                    + '<td>' + badgeStatus(v.status) + '</td>'
                    + '</tr>';
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        function abrirModal(dados) {
            veiculoSelecionado = JSON.parse(decodeURIComponent(dados));
            document.getElementById('modalTitulo').textContent = (veiculoSelecionado.marca ? veiculoSelecionado.marca.nome : '') + ' ' + veiculoSelecionado.modelo;
            document.getElementById('modalInfo').textContent = veiculoSelecionado.anoFabricacao + ' · ' + veiculoSelecionado.cor + ' · ' + formatarPreco(veiculoSelecionado.preco);
            document.getElementById('inputPreco').value = veiculoSelecionado.preco;
            atualizarBotoeStatus(veiculoSelecionado.status);
            document.getElementById('modalMsg').className = 'modal-msg';
            document.getElementById('modalMsg').textContent = '';
            document.getElementById('overlay').classList.add('aberto');
        }

        function atualizarBotoeStatus(statusAtual) {
            document.getElementById('btnDisponivel').className = 'btn-status' + (statusAtual === 'Disponível' ? ' ativo-disponivel' : '');
            document.getElementById('btnVendido').className = 'btn-status' + (statusAtual === 'Vendido' ? ' ativo-vendido' : '');
            document.getElementById('btnReservado').className = 'btn-status' + (statusAtual === 'Reservado' ? ' ativo-reservado' : '');
        }

        function fecharModal() {
            document.getElementById('overlay').classList.remove('aberto');
            veiculoSelecionado = null;
        }

        function fecharSeForaModal(e) {
            if (e.target === document.getElementById('overlay')) fecharModal();
        }

        async function salvarPreco() {
            if (!veiculoSelecionado) return;
            const novoPreco = parseFloat(document.getElementById('inputPreco').value);
            const msg = document.getElementById('modalMsg');
            if (isNaN(novoPreco) || novoPreco < 0) {
                msg.className = 'modal-msg erro';
                msg.textContent = 'Digite um preço válido.';
                return;
            }
            try {
                const res = await fetch('/veiculos/' + veiculoSelecionado.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preco: novoPreco,
                        quilometragem: veiculoSelecionado.quilometragem,
                        status: veiculoSelecionado.status
                    })
                });
                if (res.ok) {
                    veiculoSelecionado.preco = novoPreco;
                    document.getElementById('modalInfo').textContent = veiculoSelecionado.anoFabricacao + ' · ' + veiculoSelecionado.cor + ' · ' + formatarPreco(novoPreco);
                    msg.className = 'modal-msg sucesso';
                    msg.textContent = 'Preço atualizado para ' + formatarPreco(novoPreco) + '!';
                    setTimeout(() => buscar(), 800);
                } else {
                    msg.className = 'modal-msg erro';
                    msg.textContent = 'Erro ao atualizar preço.';
                }
            } catch (e) {
                msg.className = 'modal-msg erro';
                msg.textContent = 'Erro de conexão.';
            }
        }

        async function alterarStatus(novoStatus) {
            if (!veiculoSelecionado) return;
            try {
                const res = await fetch('/veiculos/' + veiculoSelecionado.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preco: veiculoSelecionado.preco,
                        quilometragem: veiculoSelecionado.quilometragem,
                        status: novoStatus
                    })
                });
                const msg = document.getElementById('modalMsg');
                if (res.ok) {
                    veiculoSelecionado.status = novoStatus;
                    atualizarBotoeStatus(novoStatus);
                    msg.className = 'modal-msg sucesso';
                    msg.textContent = 'Status alterado para ' + novoStatus + '!';
                    setTimeout(() => buscar(), 800);
                } else {
                    msg.className = 'modal-msg erro';
                    msg.textContent = 'Erro ao alterar status.';
                }
            } catch (e) {
                document.getElementById('modalMsg').className = 'modal-msg erro';
                document.getElementById('modalMsg').textContent = 'Erro de conexão.';
            }
        }

        async function apagarVeiculo() {
            if (!veiculoSelecionado) return;
            if (!confirm('Tem certeza que deseja apagar "' + veiculoSelecionado.modelo + '"? Esta ação não pode ser desfeita.')) return;
            try {
                const res = await fetch('/veiculos/' + veiculoSelecionado.id, { method: 'DELETE' });
                if (res.ok) {
                    fecharModal();
                    buscar();
                } else {
                    document.getElementById('modalMsg').className = 'modal-msg erro';
                    document.getElementById('modalMsg').textContent = 'Erro ao apagar veículo.';
                }
            } catch (e) {
                document.getElementById('modalMsg').className = 'modal-msg erro';
                document.getElementById('modalMsg').textContent = 'Erro de conexão.';
            }
        }

        function limpar() {
            document.getElementById('fMarca').value = '';
            document.getElementById('fModelo').value = '';
            document.getElementById('fCor').value = '';
            document.getElementById('fAno').value = '';
            document.getElementById('fStatus').value = '';
            document.getElementById('resultadoInfo').textContent = '';
            document.getElementById('resultados').innerHTML = '';
            document.getElementById('dica').style.display = 'none';
        }

        buscar();
    </script>
</body>
</html>
