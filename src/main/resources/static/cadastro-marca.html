<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Marca</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 16px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .topo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .btn-voltar {
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            color: #2d3748;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-voltar:hover { background: #cbd5e0; }
        h1 { font-size: 22px; color: #1a202c; }
        .grupo { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #2b6cb0; }
        .btn-cadastrar {
            width: 100%;
            padding: 14px;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-cadastrar:hover { background: #2c5282; }
        .mensagem { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
        .mensagem.sucesso { background: #c6f6d5; color: #276749; display: block; }
        .mensagem.erro { background: #fed7d7; color: #9b2c2c; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">
            <button onclick="history.back()" class="btn-voltar">&#8592; Voltar</button>
            <h1>Cadastrar Marca</h1>
        </div>
        <form id="formMarca">
            <div class="grupo">
                <label for="nome">Nome da Marca</label>
                <input type="text" id="nome" placeholder="Ex: Toyota" required>
            </div>
            <div class="grupo">
                <label for="paisOrigem">País de Origem</label>
                <input type="text" id="paisOrigem" placeholder="Ex: Japão" required>
            </div>
            <button type="submit" class="btn-cadastrar">Cadastrar Marca</button>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>
    <script>
        document.getElementById('formMarca').addEventListener('submit', async function(e) {
            e.preventDefault();
            const corpo = {
                nome: document.getElementById('nome').value,
                paisOrigem: document.getElementById('paisOrigem').value
            };
            try {
                const res = await fetch('/marcas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });
                const msg = document.getElementById('mensagem');
                if (res.ok) {
                    msg.className = 'mensagem sucesso';
                    msg.textContent = 'Marca cadastrada! Redirecionando...';
                    setTimeout(() => { window.location.href = 'cadastro.html'; }, 1200);
                } else {
                    msg.className = 'mensagem erro';
                    msg.textContent = 'Erro ao cadastrar marca. Tente novamente.';
                }
            } catch (e) {
                const msg = document.getElementById('mensagem');
                msg.className = 'mensagem erro';
                msg.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
